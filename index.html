<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkbench</title>
<meta name="description" content="Wire up an Arduino-style board, program it with blocks, and read the MicroPython it makes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M13.500 1 4 13.500h6L8.500 23 20 9.500h-6.500z" fill="#ff6a13"/></svg>
    <span class="brand-name">Sparkbench</span>
    <span class="brand-tag">wire it, block it, read the Python</span>
  </div>
  <div class="seg" role="group" aria-label="Mode">
    <button type="button" id="modeMission">Missions</button>
    <button type="button" id="modeFree">Free build</button>
  </div>
  <div class="spacer"></div>
  <button type="button" id="tourBtn" class="ghost-btn" aria-pressed="false">Meet the board</button>
  <button type="button" id="soundBtn" class="ghost-btn" aria-pressed="true">Sound on</button>
  <button type="button" id="runBtn" class="run">Run</button>
</header>

<main class="app">
  <section class="left" aria-label="Workbench">
    <div class="bench-wrap">
      <svg id="bench" viewBox="0 0 760 622" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Workbench with an UNO-style board and parts"></svg>
      <div id="tourCard" class="tour-card" hidden></div>
      <div id="benchHint" class="bench-hint"></div>
    </div>
    <div id="panel" class="panel"></div>
  </section>

  <section class="right" aria-label="Program">
    <div class="blocks">
      <div id="palette" aria-label="Blocks to use"></div>
      <div id="program" aria-label="Your program"></div>
    </div>
    <div class="code">
      <div class="tabs">
        <button type="button" id="tabPy" class="tab on">MicroPython</button>
        <button type="button" id="tabOut" class="tab">Output<span id="outDot" class="dot" hidden></span></button>
        <div class="spacer"></div>
        <button type="button" id="copyBtn" class="tab-act">Copy code</button>
      </div>
      <div id="py" class="py" aria-label="MicroPython code"></div>
      <div id="out" class="out" hidden aria-live="polite"></div>
    </div>
  </section>
</main>

<script src="js/parts.js?v=2"></script>
<script src="js/blocks.js?v=2"></script>
<script src="js/sim.js?v=2"></script>
<script src="js/missions.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
